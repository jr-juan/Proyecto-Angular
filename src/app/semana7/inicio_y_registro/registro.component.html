<div class="login-page">
  <div class="login-box">
    <h2>Registro de usuario</h2>
    <form (ngSubmit)="registrarse()">
      <input type="text" placeholder="Nombre" name="nombre" [(ngModel)]="nombre" required />
      <input type="text" placeholder="Apellidos" name="apellidos" [(ngModel)]="apellidos" required />
      <input type="email" placeholder="Correo electrónico" name="email" [(ngModel)]="email" required />
      <input type="password" placeholder="Contraseña" name="password" [(ngModel)]="password" required />
      <input type="password" placeholder="Confirmar contraseña" name="confirmarPassword" [(ngModel)]="confirmarPassword" required />
      <button type="submit" class="btn-login">Registrarse</button>
    </form>
    <p class="signup-text">
      ¿Ya tienes cuenta?
      <a routerLink="/login">Inicia sesión aquí</a>
    </p>
  </div>
</div>
